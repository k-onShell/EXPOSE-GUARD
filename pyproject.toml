[project]
name = "expose-guard"
version = "1.0.0"
description = "External Attack Surface Reconnaissance & Infrastructure Auditing Framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "dnspython>=2.6.0",
    "pydantic>=2.6.0",
    "aiosqlite>=0.20.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
